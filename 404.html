<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>Página no encontrada | N.M.C & Abogados</title>
    <meta name="description" content="La página que buscas no existe. Contáctanos para ayudarte con tus necesidades legales en Manizales." />
    <meta name="robots" content="noindex, follow" />
    
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Página no encontrada | N.M.C & Abogados" />
    <meta property="og:description" content="La página que buscas no existe." />
    
    <meta name="theme-color" content="#b8892a" />
    
    <link rel="icon" type="image/png" href="img/logo_natalia-removebg-preview.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400;1,700&family=DM+Sans:wght@400;500&family=Tenor+Sans&display=swap" rel="stylesheet"/>
    <style>
      :root {
        --g: #b8892a;
        --gl: #d4aa52;
        --gx: #f0cc70;
        --ink: #080608;
        --paper: #f7f2e8;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html {
        scroll-behavior: smooth;
      }
      body {
        font-family: "DM Sans", sans-serif;
        background: var(--ink);
        color: var(--paper);
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }
      .error-container {
        text-align: center;
        padding: 40px;
        max-width: 600px;
      }
      .error-code {
        font-family: "Playfair Display", serif;
        font-size: 12rem;
        font-weight: 900;
        color: var(--g);
        line-height: 1;
        letter-spacing: -0.04em;
        opacity: 0.3;
        text-shadow: 0 0 60px rgba(184, 137, 42, 0.3);
      }
      .error-code span {
        color: var(--gx);
        opacity: 0.5;
      }
      .error-title {
        font-family: "Playfair Display", serif;
        font-size: 2.5rem;
        font-weight: 700;
        color: var(--paper);
        margin: 24px 0 16px;
      }
      .error-text {
        font-size: 1.1rem;
        line-height: 1.8;
        color: rgba(247, 242, 232, 0.6);
        margin-bottom: 40px;
      }
      .error-links {
        display: flex;
        flex-direction: column;
        gap: 16px;
        align-items: center;
      }
      .error-cta {
        display: inline-block;
        font-family: "Tenor Sans", serif;
        font-size: 0.72rem;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: var(--ink);
        background: var(--g);
        padding: 16px 40px;
        text-decoration: none;
        border-radius: 4px;
        transition: all 0.35s;
      }
      .error-cta:hover {
        background: var(--gx);
        transform: translateY(-3px);
        box-shadow: 0 12px 32px rgba(184, 137, 42, 0.35);
      }
      .error-home {
        font-size: 0.9rem;
        color: rgba(247, 242, 232, 0.5);
      }
      .error-home a {
        color: var(--g);
        text-decoration: none;
        transition: color 0.3s;
      }
      .error-home a:hover {
        color: var(--gx);
      }
      .error-icon {
        font-size: 4rem;
        margin-bottom: 24px;
        color: var(--g);
        opacity: 0.6;
      }
      @media (max-width: 600px) {
        .error-code {
          font-size: 8rem;
        }
        .error-title {
          font-size: 1.8rem;
        }
        .error-container {
          padding: 24px;
        }
      }
    </style>
  </head>
  <body>
    <div class="error-container">
      <div class="error-icon">⚖️</div>
      <div class="error-code">4<span>0</span>4</div>
      <h1 class="error-title">Página no encontrada</h1>
      <p class="error-text">
        Lo sentimos, la página que buscas no existe o ha sido movida. 
        Quizás podamos ayudarte con alguno de nuestros servicios legales.
      </p>
      <div class="error-links">
        <a href="index.html" class="error-cta">Volver al Inicio</a>
        <p class="error-home">
          o <a href="index.html#contact">contactános directamente</a>
        </p>
      </div>
    </div>
  </body>
</html>
