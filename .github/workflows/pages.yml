name: Build and publish allowlisted site

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      confirm_publication:
        description: Confirmar publicación del sitio público en main
        required: true
        type: boolean
        default: false
      profile:
        description: Perfil que se compilará y publicará
        required: true
        type: choice
        options:
          - safe
          - production
        default: safe

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    if: >-
      github.event_name == 'pull_request' ||
      (github.event_name == 'workflow_dispatch' &&
       github.ref == 'refs/heads/main' &&
       inputs.confirm_publication)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run local unit tests
        run: node --test pruebas/unit-*.mjs
      - name: Build and verify safe profile
        if: >-
          github.event_name == 'pull_request' ||
          (github.event_name == 'workflow_dispatch' &&
           github.ref == 'refs/heads/main' &&
           inputs.confirm_publication &&
           inputs.profile == 'safe')
        run: node scripts/build-public-site.mjs --profile safe --out "$RUNNER_TEMP/nmc-public-site"
      - name: Build and verify production profile
        if: >-
          github.event_name == 'workflow_dispatch' &&
          github.ref == 'refs/heads/main' &&
          inputs.confirm_publication &&
          inputs.profile == 'production'
        env:
          # Set this repository variable only after production deployment; use its /exec URL, never QA.
          NMC_REGISTRY_ENDPOINT: ${{ vars.NMC_PRODUCTION_REGISTRY_ENDPOINT }}
        run: node scripts/build-public-site.mjs --profile production --out "$RUNNER_TEMP/nmc-public-site"
      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
      - name: Upload public artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/nmc-public-site

  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' &&
       github.ref == 'refs/heads/main' &&
       inputs.confirm_publication
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy public artifact
        id: deployment
        uses: actions/deploy-pages@v4
